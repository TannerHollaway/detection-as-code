title: Scheduled Task Creation via schtasks.exe
id: 8a3f1c2e-4b5d-4e6f-9a1b-2c3d4e5f6a7b
status: experimental
description: Detects creation of a scheduled task using schtasks.exe, a common persistence and execution technique.
references:
    - https://attack.mitre.org/techniques/T1053/005/
author: Dakota Hollaway
date: 2026-10-06
tags:
    - attack.persistence
    - attack.t1053.005
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith: '\schtasks.exe'
        CommandLine|contains: '/create'
    condition: selection
falsepositives:
    - Legitimate software installers creating scheduled tasks
    - Administrators creating scheduled tasks manually
level: medium